<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pollster Polls</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <h1>Pollster Polls</h1>

    <form>
        <fieldset>
            <legend>Contact Information</legend>
            <div class="form-item label-narrow">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname">
            </div>
            <div class="form-item label-narrow">
                <label for="useremail">Email:</label>
                <input type="email" id="useremail" name="useremail">
            </div>
        </fieldset>

        <fieldset>
            <legend>Questions</legend>
            <div class="form-item label-wide">
                <label for="browser">What is your favorite internet browser?</label>
                <select id="browser" name="browser">
                    <option value="chrome">Chrome</option>
                    <option value="safari">Safari</option>
                    <option value="opera">Opera</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-item label-wide">
                <label for="pet">Do you have a household pet?</label>
                <input type="checkbox" id="pet" name="pet">
            </div>
            <div class="form-item textarea-item">
                <label for="places">List the places you have lived:</label>
                <textarea id="places" name="places" rows="4" placeholder="Denver Colorado, Houston Texas, Tokyo Japan"></textarea>
            </div>
        </fieldset>

        <button type="submit">Submit Poll</button>
    </form>

    <footer>
        <p>&copy;Dustin Letts 2026</p>
    </footer>
</body>

</html>
