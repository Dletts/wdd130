<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <h1>Pollster Polls</h1>
</body>

<form>
    <fieldset>
        <legend>Contact Information</legend>
        <p>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>
            <label for="useremail">Email:</label>
            <input type="email" id="useremail" name="useremail" required>
        </p>
    </fieldset>
    <fieldset>
        <legend>Questions</legend>
        <p>
            <label for="browser">What is your favorite internet browser?</label>
            <select id="browser" name="browser">
                <option value="chrome">Chrome</option>
                <option value="safari">Safari</option>
                <option value="Opera">Opera</option>
                <option value="other">Other</option>
            </select>
        </p>
        <p>
            <label for="pet">Do you have a household pet?</label>
            <input type="checkbox" id="pet" name="pet">
        </p>
        <p>
            <label for="places">List the places you have lived:</label>
            <textarea id="places" name="places" rows="4" placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>
        </p>
    </fieldset>
</form>

<button type="submit">Submit Poll</button>
