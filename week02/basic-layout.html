<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Structure</title>
    <meta name="description" content="A basic HTML structure example using semantic HTML elements">
    <meta name="author" content="Dustin Letts">
</head>

<body>
    <header>
        <img #src="images/basic-logo.png" alt="A minimalist stylized computer displaying code." width="128" height="128">
    </header>
    <nav>
        <ul>
            <li><a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">Music-Video</a></li>
            <li><a href="https://upload.wikimedia.org/wikipedia/en/7/73/Trollface.png?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original">Meme Face</a></li>
        </ul>
    </nav>
    <main>
        <h1>Basic HTML Structure</h1>
        <section>
            <h2>Heading</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Odio, vitae.</p>
        </section>
        <section>
            <h2>Heading 2</h2>
            <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Dicta, sapiente.</p>
        </section>
    </main>
    <aside>
        <img src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/fort-collins-colorado/2018/800x500/Fort-Collins-Temple02.jpg" alt="Fort Collins temple at sunset" width="200">
    </aside>
    <footer>
        <p>Dustin Letts</p>
    </footer>
</body>

</html>
