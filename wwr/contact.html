<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Wild Water Rafting</title>
    <meta name="description" content="Contact Wild Water Rafting in Golden, Colorado. Ask about reservations, send feedback, or get in touch with our river guides and staff.">
    <meta name="author" content="Dustin Letts">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/wwr-logo.png" alt="Wild Water Rafting logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="company-info">
            <h1>White Water Rafting Company</h1>
            <address>
                123 Main River Street<br>
                Golden, Colorado<br>
                <a href="tel:+19999999999">+1 999 999 9999</a><br>
                <a href="mailto:info@whitewater.com">info@whitewater.com</a>
            </address>
        </section>

        <div class="contact-layout">
            <!-- Paste YOUR Google Maps embed code here, and delete style="border:0" -->
            <iframe class="map" src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d11177.993370070864!2d-105.63351680894458!3d40.43368018635277!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1794443065104!5m2!1sen!2sus" title="Map showing the location of Wild Water Rafting in Golden, Colorado" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            <form action="#" method="post">
                <div class="form-item">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-item">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <fieldset>
                    <legend>Message Purpose</legend>
                    <label><input type="radio" name="purpose" value="general" checked> General Inquiry</label>
                    <label><input type="radio" name="purpose" value="reservation"> Reservation Question</label>
                    <label><input type="radio" name="purpose" value="suggestion"> Website Suggestion</label>
                </fieldset>

                <div class="form-item">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Type here" required></textarea>
                </div>

                <label class="checkbox-label">
                    <input type="checkbox" name="newsletter" value="yes">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>

        <section class="staff">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/dustin.jpg" alt="Portrait of Dustin Letts, owner">
                <figcaption>Dustin Letts<br>Owner</figcaption>
            </figure>
            <figure>
                <img src="images/sage.jpg" alt="Portrait of Sage Andersen, head river guide">
                <figcaption>Sage Andersen<br>Head River Guide</figcaption>
            </figure>
            <figure>
                <img src="images/tanya.jpg" alt="Portrait of Rebecca Trayer, reservations manager">
                <figcaption>Rebecca Trayer<br>Reservations Manager</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>©2026 Wild Water Rafting, Dustin Letts</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com/"><img src="images/facebook.png" alt="Facebook"></a>
            <a href="https://www.instagram.com/"><img src="images/instagram.jpeg" alt="Instagram"></a>
            <a href="https://www.youtube.com/"><img src="images/youtube.png" alt="YouTube"></a>
        </nav>
    </footer>
</body>

</html>
